<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eugene Bertrand: Personal site and portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="global.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Eugene Bertrand</h1>
      <p>Student at University of California, San Diego studying Data Science</p>
    </header>

    <figure>
      <img src="images/photoportfolio.jpeg" alt="Photo of Iron Man landing on the ground!">
      <figcaption>Photo of Iron Man landing on the ground!</figcaption>
    </figure>

    <section>
      <h2>GitHub Profile</h2>
      <div id="profile-stats" aria-live="polite">Loading GitHub stats...</div>
    </section>

    <section>
      <h2 class="projects-title">Latest Projects</h2>
      <div class="projects" id="latest-projects" aria-live="polite"></div>
      <p><a href="projects/">View all projects</a></p>
    </section>
  </main>
  <script type="module" src="index.js"></script>
</body>
</html>
