<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="../global.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Meta</h1>
      <p>A scrollytelling view of the portfolio codebase over time.</p>
    </header>

    <div class="time-filter">
      <label for="commit-progress">Show commits until:</label>
      <input type="range" id="commit-progress" min="0" max="100" value="100">
      <time id="commit-time"></time>
    </div>

    <dl id="files" aria-label="Files by line count"></dl>

    <section aria-label="Repository summary">
      <div id="stats" aria-live="polite"></div>
    </section>

    <section id="scrolly-1">
      <div id="scatter-story"></div>
      <div id="scatter-plot">
        <h2>Commits by time of day</h2>
        <div id="chart" aria-label="Scatter plot of commit time by date"></div>
      </div>
    </section>

    <section>
      <h2>Selected commits</h2>
      <p id="selection-count">No commits selected</p>
      <dl id="language-breakdown" class="stats"></dl>
    </section>
  </main>

  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank" rel="noreferrer noopener"></a></dd>
    <dt>Date</dt>
    <dd id="commit-date"></dd>
    <dt>Time</dt>
    <dd id="commit-time-tooltip"></dd>
    <dt>Author</dt>
    <dd id="commit-author"></dd>
    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
  </dl>

  <script type="module" src="./main.js?v=4"></script>
</body>
</html>
